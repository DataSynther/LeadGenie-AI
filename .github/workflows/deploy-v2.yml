name: Deploy LeadGenie-AI → AWS V2 (ECS Fargate)

on:
  push:
    branches: [aws/deploy-v2, final-round]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Tear down all infrastructure (type 'destroy' to confirm)"
        required: false

# Cancel any in-progress run on the same branch when a new push arrives.
# This prevents concurrent CDK deploys from conflicting on CloudFormation.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # OIDC token for AWS auth
  contents: read

env:
  AWS_REGION:    ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_API_REPO:  leadgenie-api
  ECR_WORKER_REPO: leadgenie-worker
  ECS_CLUSTER:   leadgenie-cluster
  ECS_API_SVC:   leadgenie-api
  ECS_WORKER_SVC: leadgenie-worker

jobs:
  # ─── 0. Detect what changed ──────────────────────────────────────────────────
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      infra:    ${{ steps.filter.outputs.infra }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/Dockerfile'
              - 'backend/Dockerfile.worker'
            infra:
              - 'infrastructure/cdk/**'
              - '.github/workflows/deploy-v2.yml'
            frontend:
              - 'frontend/**'

  # ─── 1. Eval pipeline (pre-deploy gate) ─────────────────────────────────────
  eval:
    name: Eval Pipeline (4-Layer Gate)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt --quiet

      - name: Run 4-layer eval pipeline (no LLM judge to save cost)
        env:
          NO_LLM_JUDGE: "true"
        run: bash scripts/run_evals.sh

  # ─── 2. Build & push Docker images ──────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [changes, eval]
    outputs:
      api_image:    ${{ steps.resolve.outputs.api_image }}
      worker_image: ${{ steps.resolve.outputs.worker_image }}
      skipped:      ${{ steps.resolve.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_ENV

      - name: Check if images already exist for this SHA
        id: check-images
        run: |
          API_TAG="${{ github.sha }}"
          WORKER_TAG="${{ github.sha }}"
          API_EXISTS=false
          WORKER_EXISTS=false

          if aws ecr describe-images \
            --repository-name $ECR_API_REPO \
            --image-ids imageTag=$API_TAG \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            API_EXISTS=true
          fi

          if aws ecr describe-images \
            --repository-name $ECR_WORKER_REPO \
            --image-ids imageTag=$WORKER_TAG \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            WORKER_EXISTS=true
          fi

          echo "api_exists=$API_EXISTS"     >> $GITHUB_OUTPUT
          echo "worker_exists=$WORKER_EXISTS" >> $GITHUB_OUTPUT
          echo "API image exists: $API_EXISTS, Worker image exists: $WORKER_EXISTS"

      - name: Build & push API image
        id: meta-api
        if: needs.changes.outputs.backend == 'true' || steps.check-images.outputs.api_exists == 'false'
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_API_REPO:${{ github.sha }}
          docker build -f backend/Dockerfile -t $IMAGE .
          docker push $IMAGE
          docker tag $IMAGE $ECR_REGISTRY/$ECR_API_REPO:latest
          docker push $ECR_REGISTRY/$ECR_API_REPO:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & push Worker image
        id: meta-worker
        if: needs.changes.outputs.backend == 'true' || steps.check-images.outputs.worker_exists == 'false'
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }}
          docker build -f backend/Dockerfile.worker -t $IMAGE .
          docker push $IMAGE
          docker tag $IMAGE $ECR_REGISTRY/$ECR_WORKER_REPO:latest
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Resolve final image URIs
        id: resolve
        run: |
          # Use newly built image if available, otherwise fall back to existing SHA-tagged image
          API_IMAGE="${{ steps.meta-api.outputs.image }}"
          WORKER_IMAGE="${{ steps.meta-worker.outputs.image }}"

          if [ -z "$API_IMAGE" ]; then
            API_IMAGE="$ECR_REGISTRY/$ECR_API_REPO:${{ github.sha }}"
            echo "Reusing existing API image: $API_IMAGE"
          fi
          if [ -z "$WORKER_IMAGE" ]; then
            WORKER_IMAGE="$ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }}"
            echo "Reusing existing Worker image: $WORKER_IMAGE"
          fi

          SKIPPED=false
          if [ "${{ needs.changes.outputs.backend }}" = "false" ] && \
             [ "${{ steps.check-images.outputs.api_exists }}" = "true" ] && \
             [ "${{ steps.check-images.outputs.worker_exists }}" = "true" ]; then
            SKIPPED=true
            echo "No backend changes and images exist — build effectively skipped"
          fi

          echo "api_image=$API_IMAGE"     >> $GITHUB_OUTPUT
          echo "worker_image=$WORKER_IMAGE" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED"         >> $GITHUB_OUTPUT

  # ─── 2. Deploy infrastructure (CDK) ─────────────────────────────────────────
  infra:
    name: CDK Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' || needs.build.outputs.skipped == 'false'
    outputs:
      alb_dns:         ${{ steps.cdk-out.outputs.alb_dns }}
      cloudfront_url:  ${{ steps.cdk-out.outputs.cloudfront_url }}
      wake_url:        ${{ steps.cdk-out.outputs.wake_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/cdk/requirements.txt

      - name: Install CDK + dependencies
        run: |
          npm install -g aws-cdk@2
          pip install -r infrastructure/cdk/requirements.txt

      - name: Remove orphaned S3 assets bucket if exists
        run: |
          BUCKET="leadgenie-assets-${{ secrets.AWS_ACCOUNT_ID }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Removing orphaned bucket $BUCKET..."
            aws s3 rm s3://$BUCKET --recursive || true
            aws s3api delete-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }}
            echo "Deleted $BUCKET"
          else
            echo "Bucket $BUCKET does not exist, skipping"
          fi

      - name: CDK Bootstrap (idempotent)
        run: |
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} \
            --app "python app.py" \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
        working-directory: infrastructure/cdk

      - name: Check and stabilize CloudFormation stacks
        run: |
          for STACK in VpcStack DataStack ComputeStack FrontendStack MonitoringStack; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name $STACK \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            echo "$STACK: $STATUS"

            if [[ "$STATUS" == "UPDATE_ROLLBACK_IN_PROGRESS" ]]; then
              echo "  → $STACK is stuck in UPDATE_ROLLBACK_IN_PROGRESS"
              echo "  → Finding stuck resources to skip..."
              # Get logical IDs of resources currently in UPDATE_ROLLBACK_IN_PROGRESS
              STUCK=$(aws cloudformation describe-stack-resources \
                --stack-name $STACK \
                --query "StackResources[?ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS'].LogicalResourceId" \
                --output text 2>/dev/null || echo "")
              if [ -n "$STUCK" ]; then
                SKIP_ARGS=$(echo "$STUCK" | tr '\t\n' ' ' | xargs -n1 echo "--resources-to-skip" | tr '\n' ' ')
                echo "  → Skipping stuck resources: $STUCK"
                aws cloudformation continue-update-rollback --stack-name $STACK $SKIP_ARGS || true
              else
                echo "  → No stuck resources found, continuing rollback..."
                aws cloudformation continue-update-rollback --stack-name $STACK || true
              fi
              echo "  → Waiting for rollback to complete (up to 8 min)..."
              timeout 480 aws cloudformation wait stack-rollback-complete --stack-name $STACK || true
              STATUS=$(aws cloudformation describe-stacks \
                --stack-name $STACK --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "UNKNOWN")
              echo "  → $STACK after recovery: $STATUS"
            fi

            if [[ "$STATUS" == "UPDATE_ROLLBACK_FAILED" ]]; then
              echo "  → $STACK in UPDATE_ROLLBACK_FAILED — forcing continue-rollback skipping all failed resources..."
              STUCK=$(aws cloudformation describe-stack-resources \
                --stack-name $STACK \
                --query "StackResources[?ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].LogicalResourceId" \
                --output text 2>/dev/null || echo "")
              SKIP_ARGS=$(echo "$STUCK" | tr '\t\n' ' ' | xargs -n1 echo "--resources-to-skip" | tr '\n' ' ')
              aws cloudformation continue-update-rollback --stack-name $STACK $SKIP_ARGS || true
              timeout 480 aws cloudformation wait stack-rollback-complete --stack-name $STACK || true
            fi
          done

      - name: Refresh AWS credentials before deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy all stacks
        id: cdk-deploy
        env:
          API_IMAGE:        ${{ needs.build.outputs.api_image }}
          WORKER_IMAGE:     ${{ needs.build.outputs.worker_image }}
          ALERT_EMAIL:      ${{ secrets.ALERT_EMAIL }}
          # App secrets — passed to Secrets Manager via CDK
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY:    ${{ secrets.APOLLO_API_KEY }}
          VOYAGE_API_KEY:    ${{ secrets.VOYAGE_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          LEADGENIE_GMAIL:   ${{ secrets.LEADGENIE_GMAIL }}
          LEADGENIE_GMAIL_PASSWORD: ${{ secrets.LEADGENIE_GMAIL_PASSWORD }}
          NEO4J_URI:         ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME:    ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD:    ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Stage 1: VpcStack + DataStack ===" | tee -a /tmp/cdk.log
          cdk deploy VpcStack DataStack --exclusively --require-approval never \
            --app "python app.py" 2>&1 | tee -a /tmp/cdk.log
          echo "=== Stage 2: ComputeStack ===" | tee -a /tmp/cdk.log
          cdk deploy ComputeStack --exclusively --require-approval never \
            --app "python app.py" 2>&1 | tee -a /tmp/cdk.log
          echo "=== Stage 3: FrontendStack MonitoringStack ===" | tee -a /tmp/cdk.log
          cdk deploy FrontendStack MonitoringStack --exclusively --require-approval never \
            --outputs-file cdk-outputs.json \
            --app "python app.py" 2>&1 | tee -a /tmp/cdk.log
        working-directory: infrastructure/cdk

      - name: Capture CloudFormation errors on failure
        if: failure() && steps.cdk-deploy.outcome == 'failure'
        run: |
          {
            echo "## CDK Deploy Failure — CloudFormation Diagnostics"
            echo "### CDK Output (last 80 lines)"
            echo '```'
            tail -80 /tmp/cdk.log 2>/dev/null || echo "(no cdk log)"
            echo '```'
            echo ""
            echo ""
            echo "### Stack States"
            echo "| Stack | Status |"
            echo "|-------|--------|"
            for STACK in VpcStack DataStack ComputeStack FrontendStack MonitoringStack; do
              STATUS=$(aws cloudformation describe-stacks \
                --stack-name $STACK \
                --query "Stacks[0].StackStatus" \
                --output text 2>/dev/null || echo "NOT_FOUND")
              echo "| $STACK | $STATUS |"
            done
            echo ""
            echo "### Failed Events"
            for STACK in VpcStack DataStack ComputeStack FrontendStack MonitoringStack; do
              EVENTS=$(aws cloudformation describe-stack-events \
                --stack-name $STACK \
                --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceStatusReason]" \
                --output text 2>/dev/null | head -20 || echo "")
              if [ -n "$EVENTS" ]; then
                echo "**$STACK failures:**"
                echo '```'
                echo "$EVENTS"
                echo '```'
              fi
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: Extract CDK outputs
        id: cdk-out
        run: |
          ALB=$(jq -r '.ComputeStack.AlbDns // ""' infrastructure/cdk/cdk-outputs.json 2>/dev/null || echo "")
          CF=$(jq  -r '.FrontendStack.CloudFrontUrl // ""' infrastructure/cdk/cdk-outputs.json 2>/dev/null || echo "")
          WAKE=$(jq -r '.MonitoringStack.WakeUrl // ""' infrastructure/cdk/cdk-outputs.json 2>/dev/null || echo "")
          echo "alb_dns=$ALB"        >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CF"  >> $GITHUB_OUTPUT
          echo "wake_url=$WAKE"      >> $GITHUB_OUTPUT

  # ─── 2b. Fetch infra URLs when CDK job was skipped or failed ───────────────
  infra-urls:
    name: Fetch Infra URLs (CDK skipped)
    runs-on: ubuntu-latest
    needs: [changes, build, infra]
    if: always() && (needs.infra.result == 'skipped' || needs.infra.result == 'failure')
    outputs:
      alb_dns:        ${{ steps.fetch.outputs.alb_dns }}
      cloudfront_url: ${{ steps.fetch.outputs.cloudfront_url }}
      wake_url:       ${{ steps.fetch.outputs.wake_url }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch outputs from existing stacks
        id: fetch
        run: |
          ALB=$(aws cloudformation describe-stacks \
            --stack-name ComputeStack \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDns'].OutputValue" \
            --output text 2>/dev/null || echo "")
          CF=$(aws cloudformation describe-stacks \
            --stack-name FrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          WAKE=$(aws cloudformation describe-stacks \
            --stack-name MonitoringStack \
            --query "Stacks[0].Outputs[?OutputKey=='WakeUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "alb_dns=$ALB"        >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CF"  >> $GITHUB_OUTPUT
          echo "wake_url=$WAKE"      >> $GITHUB_OUTPUT
          echo "Fetched ALB=$ALB CF=$CF WAKE=$WAKE"

  # ─── 3. Deploy frontend to S3 ────────────────────────────────────────────────
  frontend:
    name: Deploy Frontend → S3 + CloudFront
    runs-on: ubuntu-latest
    needs: [changes, infra, infra-urls]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped' || needs.infra.result == 'failure') &&
      (needs.infra-urls.result == 'success' || needs.infra-urls.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve CloudFront URL
        id: urls
        run: |
          CF="${{ needs.infra.outputs.cloudfront_url }}"
          if [ -z "$CF" ]; then
            CF="${{ needs.infra-urls.outputs.cloudfront_url }}"
          fi
          echo "cloudfront_url=$CF" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.urls.outputs.cloudfront_url }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name FrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucket'].OutputValue" \
            --output text)
          # Upload all assets (including HTML) — deletes removed files
          aws s3 sync frontend/dist s3://$BUCKET --delete --cache-control "max-age=86400"
          # Re-upload every HTML file with no-cache so browsers never serve stale pages
          find frontend/dist -name "*.html" | while read f; do
            key="${f#frontend/dist/}"
            aws s3 cp "$f" "s3://$BUCKET/$key" \
              --cache-control "no-cache, no-store, must-revalidate"
          done

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name FrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

  # ─── 4. Smoke test ───────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [infra, infra-urls, frontend]
    if: |
      always() &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve URLs
        id: urls
        run: |
          ALB="${{ needs.infra.outputs.alb_dns }}"
          CF="${{ needs.infra.outputs.cloudfront_url }}"
          WAKE="${{ needs.infra.outputs.wake_url }}"

          # Fall back to infra-urls if CDK job was skipped
          if [ -z "$ALB" ]; then ALB="${{ needs.infra-urls.outputs.alb_dns }}"; fi
          if [ -z "$CF" ];  then CF="${{ needs.infra-urls.outputs.cloudfront_url }}"; fi
          if [ -z "$WAKE" ]; then WAKE="${{ needs.infra-urls.outputs.wake_url }}"; fi

          echo "alb_dns=$ALB"        >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CF"  >> $GITHUB_OUTPUT
          echo "wake_url=$WAKE"      >> $GITHUB_OUTPUT

      - name: Wake ECS service for smoke test
        run: |
          echo "Ensuring API service has at least 1 task running..."
          DESIRED=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_API_SVC }} \
            --query "services[0].desiredCount" --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "Service is sleeping — scaling to 1 for smoke test"
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.ECS_API_SVC }} \
              --desired-count 1
          fi
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_API_SVC }}
          echo "ECS service stable"

      - name: Health check
        run: |
          ALB="${{ steps.urls.outputs.alb_dns }}"
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB/health)
            [ "$STATUS" = "200" ] && echo "Health check passed" && exit 0
            echo "Attempt $i: status $STATUS — retrying in 15s"
            sleep 15
          done
          echo "Health check failed" && exit 1

      - name: Notify deployment success
        if: success()
        run: |
          aws sns publish \
            --topic-arn $(aws cloudformation describe-stacks \
              --stack-name MonitoringStack \
              --query "Stacks[0].Outputs[?OutputKey=='AlertTopicArn'].OutputValue" \
              --output text) \
            --subject "LeadGenie-AI deployed" \
            --message "Deployment succeeded.
          UI:   ${{ steps.urls.outputs.cloudfront_url }}
          API:  https://${{ steps.urls.outputs.alb_dns }}
          Wake: ${{ steps.urls.outputs.wake_url }}
          Commit: ${{ github.sha }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          aws sns publish \
            --topic-arn $(aws cloudformation describe-stacks \
              --stack-name MonitoringStack \
              --query "Stacks[0].Outputs[?OutputKey=='AlertTopicArn'].OutputValue" \
              --output text) \
            --subject "LeadGenie-AI deployment FAILED" \
            --message "Deployment failed on commit ${{ github.sha }}.
          Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ─── 6. Destroy (manual trigger only) ───────────────────────────────────────
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy == 'destroy'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python + CDK
        run: |
          pip install -r infrastructure/cdk/requirements.txt
          npm install -g aws-cdk@2

      - name: CDK Destroy
        run: cdk destroy --all --force --app "python infrastructure/cdk/app.py"
