name: Deploy LeadGenie-AI → AWS V2 (ECS Fargate)

on:
  push:
    branches: [aws/deploy-v2]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Tear down all infrastructure (type 'destroy' to confirm)"
        required: false

permissions:
  id-token: write   # OIDC token for AWS auth
  contents: read

env:
  AWS_REGION:    ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_API_REPO:  leadgenie-api
  ECR_WORKER_REPO: leadgenie-worker
  ECS_CLUSTER:   leadgenie-cluster
  ECS_API_SVC:   leadgenie-api
  ECS_WORKER_SVC: leadgenie-worker

jobs:
  # ─── 1. Build & push Docker images ──────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      api_image:    ${{ steps.meta-api.outputs.image }}
      worker_image: ${{ steps.meta-worker.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_ENV

      - name: Build & push API image
        id: meta-api
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_API_REPO:${{ github.sha }}
          docker build -f backend/Dockerfile -t $IMAGE .
          docker push $IMAGE
          docker tag $IMAGE $ECR_REGISTRY/$ECR_API_REPO:latest
          docker push $ECR_REGISTRY/$ECR_API_REPO:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & push Worker image
        id: meta-worker
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }}
          docker build -f backend/Dockerfile.worker -t $IMAGE .
          docker push $IMAGE
          docker tag $IMAGE $ECR_REGISTRY/$ECR_WORKER_REPO:latest
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ─── 2. Deploy infrastructure (CDK) ─────────────────────────────────────────
  infra:
    name: CDK Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    outputs:
      alb_dns:         ${{ steps.cdk-out.outputs.alb_dns }}
      cloudfront_url:  ${{ steps.cdk-out.outputs.cloudfront_url }}
      wake_url:        ${{ steps.cdk-out.outputs.wake_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/cdk/requirements.txt

      - name: Install CDK + dependencies
        run: |
          npm install -g aws-cdk@2
          pip install -r infrastructure/cdk/requirements.txt

      - name: Discover latest available Postgres version
        id: pg-version
        run: |
          PG_VERSION=$(aws rds describe-db-engine-versions \
            --engine postgres \
            --region ${{ env.AWS_REGION }} \
            --query "sort_by(DBEngineVersions[?starts_with(EngineVersion, '16.')], &EngineVersion)[-1].EngineVersion" \
            --output text)
          echo "Detected Postgres version: $PG_VERSION"
          echo "version=$PG_VERSION" >> $GITHUB_OUTPUT

      - name: CDK Bootstrap (idempotent)
        run: |
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} \
            --app "python app.py" \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
        working-directory: infrastructure/cdk

      - name: CDK Deploy all stacks
        id: cdk-deploy
        env:
          API_IMAGE:        ${{ needs.build.outputs.api_image }}
          WORKER_IMAGE:     ${{ needs.build.outputs.worker_image }}
          ALERT_EMAIL:      ${{ secrets.ALERT_EMAIL }}
          POSTGRES_VERSION: ${{ steps.pg-version.outputs.version }}
          # App secrets — passed to Secrets Manager via CDK
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY:    ${{ secrets.APOLLO_API_KEY }}
          VOYAGE_API_KEY:    ${{ secrets.VOYAGE_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: |
          cdk deploy --all --require-approval never --outputs-file cdk-outputs.json \
            --app "python app.py"
        working-directory: infrastructure/cdk

      - name: Extract CDK outputs
        id: cdk-out
        run: |
          ALB=$(jq -r '.ComputeStack.AlbDns // ""' infrastructure/cdk/cdk-outputs.json 2>/dev/null || echo "")
          CF=$(jq  -r '.FrontendStack.CloudFrontUrl // ""' infrastructure/cdk/cdk-outputs.json 2>/dev/null || echo "")
          WAKE=$(jq -r '.MonitoringStack.WakeUrl // ""' infrastructure/cdk/cdk-outputs.json 2>/dev/null || echo "")
          echo "alb_dns=$ALB"        >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CF"  >> $GITHUB_OUTPUT
          echo "wake_url=$WAKE"      >> $GITHUB_OUTPUT

  # ─── 3. Deploy frontend to S3 ────────────────────────────────────────────────
  frontend:
    name: Deploy Frontend → S3 + CloudFront
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://${{ needs.infra.outputs.alb_dns }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name FrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucket'].OutputValue" \
            --output text)
          aws s3 sync frontend/dist s3://$BUCKET --delete --cache-control "max-age=86400"
          aws s3 cp frontend/dist/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name FrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

  # ─── 4. Update ECS services with new images ──────────────────────────────────
  deploy:
    name: Rolling Deploy ECS Services
    runs-on: ubuntu-latest
    needs: [build, infra]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API task definition
        id: task-def-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/task-definitions/api.json
          container-name: leadgenie-api
          image: ${{ needs.build.outputs.api_image }}

      - name: Update Worker task definition
        id: task-def-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/task-definitions/worker.json
          container-name: leadgenie-worker
          image: ${{ needs.build.outputs.worker_image }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-api.outputs.task-definition }}
          service: ${{ env.ECS_API_SVC }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-worker.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SVC }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ─── 5. Smoke test ───────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy, frontend]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check
        run: |
          ALB="${{ needs.infra.outputs.alb_dns }}"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB/health)
            [ "$STATUS" = "200" ] && echo "✓ Backend healthy" && exit 0
            echo "Attempt $i: status $STATUS — retrying in 10s"
            sleep 10
          done
          echo "✗ Health check failed" && exit 1

      - name: Notify deployment success
        if: success()
        run: |
          aws sns publish \
            --topic-arn $(aws cloudformation describe-stacks \
              --stack-name MonitoringStack \
              --query "Stacks[0].Outputs[?OutputKey=='AlertTopicArn'].OutputValue" \
              --output text) \
            --subject "✅ LeadGenie-AI deployed" \
            --message "Deployment succeeded.
          UI:   ${{ needs.infra.outputs.cloudfront_url }}
          API:  https://${{ needs.infra.outputs.alb_dns }}
          Wake: ${{ needs.infra.outputs.wake_url }}
          Commit: ${{ github.sha }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          aws sns publish \
            --topic-arn $(aws cloudformation describe-stacks \
              --stack-name MonitoringStack \
              --query "Stacks[0].Outputs[?OutputKey=='AlertTopicArn'].OutputValue" \
              --output text) \
            --subject "❌ LeadGenie-AI deployment FAILED" \
            --message "Deployment failed on commit ${{ github.sha }}.
          Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ─── 6. Destroy (manual trigger only) ───────────────────────────────────────
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy == 'destroy'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python + CDK
        run: |
          pip install -r infrastructure/cdk/requirements.txt
          npm install -g aws-cdk@2

      - name: CDK Destroy
        run: cdk destroy --all --force --app "python infrastructure/cdk/app.py"
