<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bot-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadGenie AI</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored === "dark" || (!stored && prefersDark);
        if (isDark) {
          document.documentElement.classList.add("dark");
          /* Set bg directly so first paint is never white, even before CSS loads */
          document.documentElement.style.backgroundColor = "rgb(11,11,15)";
        } else {
          document.documentElement.style.backgroundColor = "rgb(250,250,251)";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
