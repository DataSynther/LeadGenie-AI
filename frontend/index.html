<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bot-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadGenie AI</title>
    <script>
      (function () {
        /* Apply theme synchronously before React renders to avoid flash */
        var stored = localStorage.getItem("theme");
        /* Default to light — only go dark if the user has explicitly chosen it */
        var isDark = stored === "dark";
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = "rgb(11,11,15)";
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.backgroundColor = "rgb(250,250,251)";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
