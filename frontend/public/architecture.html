<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LeadGenie AI — Pipeline Architecture</title>
<style>
  /* ── CSS custom properties — dark default, light override ── */
  :root {
    --bg:         #0a0e1a;
    --bg-header:  #0f172a;
    --bg-bar:     #070b14;
    --bg-ctrl:    #0f172a;
    --bg-btn:     #1e293b;
    --border:     #1e293b;
    --text:       #e2e8f0;
    --text-muted: #475569;
    --btn-text:   #e2e8f0;
    --svg-bg:     transparent;
  }
  :root[data-theme="light"] {
    --bg:         #f1f5f9;
    --bg-header:  #ffffff;
    --bg-bar:     #f8fafc;
    --bg-ctrl:    #ffffff;
    --bg-btn:     #e2e8f0;
    --border:     #e2e8f0;
    --text:       #0f172a;
    --text-muted: #64748b;
    --btn-text:   #1e293b;
    --svg-bg:     #f8fafc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .25s, color .25s;
  }

  header {
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-header);
    transition: background .25s, border-color .25s;
  }
  header h1 {
    font-size: 1.2rem; font-weight: 700;
    background: linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }
  .badge   { padding: 3px 10px; border-radius: 12px; font-size: .68rem; font-weight: 600; letter-spacing:.04em; }
  .badge-live { background:#064e3b; color:#34d399; border:1px solid #065f46; }
  .badge-ai   { background:#1e1b4b; color:#a78bfa; border:1px solid #312e81; }

  /* ── Flow filter bar ── */
  .flow-bar {
    display: flex; align-items: center; gap: 7px;
    padding: 11px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-bar);
    flex-wrap: wrap;
    transition: background .25s, border-color .25s;
  }
  .flow-bar .label { font-size: .72rem; color: var(--text-muted); white-space: nowrap; margin-right: 4px; }
  .flow-btn {
    padding: 5px 14px; border-radius: 20px; border: 1.5px solid;
    font-size: .72rem; font-weight: 600; cursor: pointer; background: transparent;
    transition: background .2s, opacity .2s; letter-spacing: .02em;
  }
  .flow-btn:hover { filter: brightness(1.25); }
  .btn-discover { color:#38bdf8; border-color:#0ea5e9; }   .btn-discover.active { background:#0c4a6e; }
  .btn-generate { color:#c084fc; border-color:#a855f7; }   .btn-generate.active { background:#2e1065; }
  .btn-govern   { color:#f87171; border-color:#ef4444; }   .btn-govern.active   { background:#450a0a; }
  .btn-deliver  { color:#34d399; border-color:#10b981; }   .btn-deliver.active  { background:#064e3b; }
  .btn-reply    { color:#2dd4bf; border-color:#14b8a6; }   .btn-reply.active    { background:#134e4a; }
  .btn-observe  { color:#94a3b8; border-color:#475569; }   .btn-observe.active  { background:#1e293b; }
  .btn-clear    { color:#64748b; border-color:#334155; margin-left:6px; }
  .btn-clear:hover { border-color:#64748b; color:#94a3b8; }

  /* ── Canvas ── */
  .canvas-wrap {
    padding: 20px 12px 80px; overflow-x: auto;
    background: var(--bg); transition: background .25s;
  }
  #main-svg {
    display: block; margin: 0 auto; width: 100%; max-width: 1240px; height: auto;
    background: var(--svg-bg); border-radius: 10px;
    transition: background .25s;
  }

  /* ── Dim / highlight on filter ── */
  .filterable { transition: opacity .28s ease; }
  #main-svg.filtered .filterable              { opacity: .07; }
  #main-svg.filtered .filterable.f-band       { opacity: .15; }
  #main-svg.filtered .filterable.active-flow  { opacity: 1 !important; }

  /* ── Highlight boxes (marching ants) ── */
  .flow-highlight { display: none; pointer-events: none; }
  @keyframes march { to { stroke-dashoffset: -18; } }
  .flow-highlight rect { animation: march .55s linear infinite; }

  /* ── Theme toggle (bottom-left) ── */
  .theme-toggle {
    position: fixed; bottom: 20px; left: 24px;
    background: var(--bg-ctrl); border: 1px solid var(--border); border-radius: 50%;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); transition: background .25s, border-color .25s, transform .15s;
  }
  .theme-toggle:hover { transform: scale(1.1); }

  /* ── Controls ── */
  .controls {
    position: fixed; bottom: 20px; right: 24px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-ctrl); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 16px; font-size: .72rem; color: var(--text-muted); z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,.4); transition: background .25s, border-color .25s;
  }
  .controls button {
    background: var(--bg-btn); border: none; color: var(--btn-text);
    border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: .7rem;
    transition: background .15s;
  }
  .controls button:hover { filter: brightness(1.15); }
  .controls button.sp-active { background: #4f46e5; color: #fff; }

  /* ══════════════════════════════════════════════════════════════
     LIGHT MODE — SVG text & edge contrast  (dark mode unchanged)
     CSS attribute selectors let us target SVG elements directly.
     ══════════════════════════════════════════════════════════════ */

  /* Stage band labels (①DISCOVERY etc.) — darken per-stage */
  :root[data-theme="light"] text.f-band[data-flow="discover"]       { fill: #075985; }
  :root[data-theme="light"] text.f-band[data-flow="generate"]       { fill: #3b0764; }
  :root[data-theme="light"] text.f-band[data-flow="govern,deliver"] { fill: #7f1d1d; }
  :root[data-theme="light"] text.f-band[data-flow="deliver"]        { fill: #064e3b; }
  :root[data-theme="light"] text.f-band[data-flow="reply"]          { fill: #0f766e; }
  :root[data-theme="light"] text.f-band[data-flow="observe"]        { fill: #0f172a; }

  /* Right-edge section labels and any other standalone SVG text
     with class="filterable" — only top-level text elements are
     targeted (node interior texts lack the filterable class). */
  :root[data-theme="light"] text.filterable[data-flow="discover"]       { fill: #075985; }
  :root[data-theme="light"] text.filterable[data-flow="generate"]       { fill: #3b0764; }
  :root[data-theme="light"] text.filterable[data-flow="govern,deliver"] { fill: #7f1d1d; }
  :root[data-theme="light"] text.filterable[data-flow="deliver"]        { fill: #064e3b; }
  :root[data-theme="light"] text.filterable[data-flow="reply"]          { fill: #0f766e; }
  :root[data-theme="light"] text.filterable[data-flow="observe"]        { fill: #0f172a; }

  /* Edge arrow strokes — brightneon → accessible dark equivalent */
  :root[data-theme="light"] path.filterable[stroke="#38bdf8"] { stroke: #0369a1; }
  :root[data-theme="light"] path.filterable[stroke="#a78bfa"] { stroke: #5b21b6; }
  :root[data-theme="light"] path.filterable[stroke="#fbbf24"] { stroke: #78350f; }
  :root[data-theme="light"] path.filterable[stroke="#c084fc"] { stroke: #6d28d9; }
  :root[data-theme="light"] path.filterable[stroke="#f87171"] { stroke: #991b1b; }
  :root[data-theme="light"] path.filterable[stroke="#34d399"] { stroke: #065f46; }
  :root[data-theme="light"] path.filterable[stroke="#2dd4bf"] { stroke: #0f766e; }
  :root[data-theme="light"] path.filterable[stroke="#94a3b8"] { stroke: #334155; }

  /* Animated data-packet circles */
  :root[data-theme="light"] g.filterable circle { filter: brightness(0.55) saturate(1.5); }

  /* Flow-highlight box labels ("Discover Leads" etc.) */
  :root[data-theme="light"] .flow-highlight text { fill: #1e293b; }
</style>
</head>
<body>

<header>
  <div>
    <h1>LeadGenie AI — End-to-End Pipeline</h1>

  </div>
  <div style="margin-left:auto;display:flex;gap:8px">

  <button class="flow-btn btn-clear"    data-flow=""        >✕ Show All</button>
</div>

<button id="theme-toggle-btn" class="theme-toggle" title="Toggle dark/light mode">☀️</button>

<div class="controls">
  <span>Anim:</span>
  <button id="btn-play"  class="sp-active" onclick="setAnim(true)">▶ Play</button>
  <button id="btn-pause" onclick="setAnim(false)">⏸ Pause</button>
</div>

<script>
  const svg = document.getElementById('main-svg');

  // ── Theme sync — reads localStorage, listens for parent toggle ────────────
  function applyTheme(t) {
    const isLight = t === 'light';
    document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) btn.textContent = isLight ? '🌙' : '☀️';
    svg.querySelectorAll('linearGradient[id^="g-"]').forEach(g => {
      const stops = g.querySelectorAll('stop');
      if (stops[0]) stops[0].setAttribute('stop-opacity', isLight ? '0.72' : '0.5');
      if (stops[1]) stops[1].setAttribute('stop-opacity', isLight ? '0.34' : '0.06');
    });
  }
  applyTheme(localStorage.getItem('theme'));
  window.addEventListener('storage', e => { if (e.key === 'theme') applyTheme(e.newValue); });

  document.getElementById('theme-toggle-btn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  // ── Flow filter ───────────────────────────────────────────────────────────
  let activeFlow = '';
  document.querySelectorAll('.flow-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const flow = btn.dataset.flow;
      if (!flow || flow === activeFlow) {
        activeFlow = '';
        svg.classList.remove('filtered');
        svg.querySelectorAll('.filterable').forEach(el => el.classList.remove('active-flow'));
        svg.querySelectorAll('.flow-highlight').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('active'));
        return;
      }
      activeFlow = flow;
      svg.classList.add('filtered');
      svg.querySelectorAll('.filterable').forEach(el => {
        const flows = (el.dataset.flow || '').split(',');
        el.classList.toggle('active-flow', flows.includes(flow));
      });
      svg.querySelectorAll('.flow-highlight').forEach(el => {
        el.style.display = el.dataset.flow === flow ? '' : 'none';
      });
      document.querySelectorAll('.flow-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.flow === flow);
      });
    });
  });

  // ── Animation pause/play ──────────────────────────────────────────────────
  function setAnim(play) {
    play ? svg.unpauseAnimations() : svg.pauseAnimations();
    document.getElementById('btn-play').classList.toggle('sp-active', play);
    document.getElementById('btn-pause').classList.toggle('sp-active', !play);
  }
</script>
